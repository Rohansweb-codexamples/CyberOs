<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CyberOS Setup</title><style>:root{--c:#00f6ff;--p:#ff2bd6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#02040a;color:#eaffff;font-family:system-ui;background-image:linear-gradient(#00f6ff0b 1px,transparent 1px),linear-gradient(90deg,#00f6ff0b 1px,transparent 1px);background-size:32px 32px}.panel{width:min(760px,96vw);padding:30px;background:#030914f5;border:1px solid var(--c);box-shadow:0 0 55px #00f6ff25}.logo{color:var(--c);font-weight:900;letter-spacing:4px}.pink{color:var(--p)}h1{font-size:34px}.muted{color:#83a9b7}.steps{display:flex;gap:6px;margin:20px 0}.step{height:5px;flex:1;background:#17232b}.on{background:var(--c);box-shadow:0 0 10px var(--c)}.card{padding:20px;border:1px solid #00f6ff35;background:#06111f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}input,button{font:inherit;padding:12px;border-radius:5px}input{width:100%;background:#020711;color:white;border:1px solid #00f6ff55;margin:7px 0 14px}button{background:#06152a;color:white;border:1px solid #00f6ff66;cursor:pointer;font-weight:800}button:hover{border-color:var(--c);box-shadow:0 0 15px #00f6ff22}.primary{background:var(--c);color:#02040a}.theme.active{border-color:var(--c);box-shadow:0 0 15px #00f6ff33}</style></head><body><main class="panel"><div class="logo">CYBEROS <span class="pink">V2</span></div><h1>System Setup</h1><p class="muted">Configure your workspace before entering CyberOS.</p><div class="steps"><i class="step on"></i><i class="step"></i><i class="step"></i></div><section id="page"></section></main><script>const S='cyberos-v2-state',D={setup:true,business:false,name:'Operator',company:'CYBER NETWORK',accent:'#00f6ff',theme:'cyber'};const T={cyber:['Cyber Neon','#00f6ff','#ff2bd6'],matrix:['Matrix','#00ff66','#00cc44'],violet:['Violet Pulse','#b36bff','#ff4fd8'],sunset:['Neon Sunset','#ffb000','#ff3b7a'],ice:['Ice Grid','#75e6ff','#8fb8ff']};let state;try{state={...D,...JSON.parse(localStorage.getItem(S)||'null')}}catch(e){state={...D}}let step=0;const esc=x=>String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));function save(){localStorage.setItem(S,JSON.stringify(state))}function render(){document.querySelectorAll('.step').forEach((x,i)=>x.classList.toggle('on',i<=step));if(step===0)page.innerHTML='<div class="card"><h2>Welcome</h2><p class="muted">Choose an operator name.</p><input id="name" value="'+esc(state.name)+'"><button class="primary" onclick="next()">NEXT</button></div>';if(step===1)page.innerHTML='<div class="card"><h2>Workspace</h2><p class="muted">Choose Personal or Business mode.</p><div class="grid"><button onclick="state.business=false;next()">PERSONAL</button><button onclick="state.business=true;next()">BUSINESS</button></div></div>';if(step===2)page.innerHTML='<div class="card"><h2>Customise</h2><label>Company / workspace</label><input id="company" value="'+esc(state.company)+'"><h3>Theme</h3><div class="grid">'+Object.entries(T).map(([k,t])=>'<button class="theme '+(state.theme===k?'active':'')+'" onclick="state.theme=\''+k+'\';state.accent=\''+t[1]+'\';render()"><b>'+t[0]+'</b><br><small>'+t[1]+'</small></button>').join('')+'</div><br><button class="primary" onclick="finish()">FINISH SETUP</button></div>'}function next(){if(step===0)state.name=document.getElementById('name').value||'Operator';step++;render()}function finish(){state.company=document.getElementById('company').value||state.company;state.setup=false;save();location.href='index.html'}render();</script></body></html>
