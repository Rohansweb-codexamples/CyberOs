<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CyberOS Setup</title>
<style>
:root{--c:#00f6ff;--p:#ff2bd6;--lime:#a6ff00;--glass:rgba(18,22,32,.55);--glass-brd:rgba(255,255,255,.14);--radius:16px}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:#eaffff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:-2;background:linear-gradient(135deg,#0a1530 0%,#0d1030 40%,#1a0a2e 70%,#050514 100%)}
.bg:before{content:"";position:absolute;inset:0;opacity:.05;background-image:linear-gradient(rgba(0,246,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(0,246,255,.2) 1px,transparent 1px);background-size:40px 40px}
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.25;z-index:-1}
.o1{width:400px;height:400px;background:var(--c);left:-5%;top:-5%;animation:fl 14s ease-in-out infinite}
.o2{width:450px;height:450px;background:var(--p);right:-8%;bottom:-8%;animation:fl 16s ease-in-out infinite reverse}
@keyframes fl{50%{transform:translate(50px,-40px) scale(1.15)}}
.panel{width:min(820px,96vw);max-height:94vh;overflow:auto;padding:36px;background:var(--glass);border:1px solid var(--glass-brd);box-shadow:0 24px 80px rgba(0,0,0,.5);border-radius:var(--radius);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%)}
.logo{color:var(--c);font-weight:900;letter-spacing:3px;font-size:14px;display:flex;align-items:center;gap:8px}
.logo .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.pink{color:var(--p)}
h1{font-size:32px;margin:6px 0 2px;font-weight:700}
h2{font-size:20px;margin:0 0 8px;font-weight:600}
.muted{color:#9aafc0;font-size:14px;line-height:1.5}
.steps{display:flex;gap:4px;margin:18px 0 24px;flex-wrap:wrap}
.step{height:5px;flex:1;min-width:20px;background:rgba(255,255,255,.08);border-radius:3px;transition:.3s}
.step.on{background:var(--c);box-shadow:0 0 8px var(--c)}
.step.done{background:var(--lime);box-shadow:0 0 6px var(--lime)}
.step-label{font-size:10px;color:#6a8090;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.card{padding:22px;border:1px solid var(--glass-brd);background:rgba(255,255,255,.04);border-radius:12px;margin-bottom:14px;backdrop-filter:blur(10px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
input,select,button{font:inherit}
input,select{width:100%;padding:11px 14px;background:rgba(0,0,0,.25);color:white;border:1px solid var(--glass-brd);border-radius:8px;margin:6px 0 12px;outline:none;transition:.15s}
input:focus,select:focus{border-color:var(--c);box-shadow:0 0 0 2px rgba(0,246,255,.18)}
input[type=color]{height:48px;padding:4px;cursor:pointer}
button{padding:12px 22px;background:rgba(255,255,255,.06);color:white;border:1px solid var(--glass-brd);cursor:pointer;font-weight:600;border-radius:10px;transition:.15s;backdrop-filter:blur(10px)}
button:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);transform:translateY(-1px)}
button:active{transform:translateY(0)}
.primary{background:var(--c);color:#02040a;border:none;font-weight:700}
.primary:hover{background:#4df8ff;box-shadow:0 0 24px rgba(0,246,255,.4)}
.big-btn{padding:15px 28px;font-size:15px;width:100%}
.theme{padding:16px;min-height:80px;text-align:left;transition:.15s}
.theme.active{border-color:var(--c);box-shadow:0 0 16px rgba(0,246,255,.25);background:rgba(0,246,255,.08)}
.mode-card{padding:20px;text-align:center;border-radius:12px;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:6px;transition:.15s}
.mode-card .ico{font-size:32px;font-weight:900}
.mode-card.active{border-color:var(--c);box-shadow:0 0 18px rgba(0,246,255,.22);background:rgba(0,246,255,.06)}
.app-preview{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.app-chip{padding:6px 10px;border:1px solid var(--glass-brd);border-radius:6px;font-size:11px;background:rgba(255,255,255,.04)}
.app-chip.on{border-color:var(--c);color:var(--c);background:rgba(0,246,255,.08)}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;max-height:260px;overflow:auto;padding:4px}
.app-toggle{padding:12px;border:1px solid var(--glass-brd);border-radius:10px;background:rgba(255,255,255,.03);cursor:pointer;text-align:center;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:4px}
.app-toggle.on{border-color:var(--c);background:rgba(0,246,255,.06)}
.app-toggle .ico{font-size:18px;font-weight:900;color:var(--c)}
.app-toggle small{font-size:10px;color:#8aa0b0}
label{color:#9aafc0;font-size:13px;display:block;margin-bottom:3px}
.flex-row{display:flex;gap:10px;align-items:center}
.flex-row input{flex:1}
.btn-row{display:flex;gap:10px;margin-top:6px}
.btn-row button{flex:1}
.radio-grid{display:grid;gap:8px}
.radio-opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--glass-brd);border-radius:10px;background:rgba(255,255,255,.03);cursor:pointer;transition:.15s}
.radio-opt.active{border-color:var(--c);background:rgba(0,246,255,.06)}
.radio-opt .dot{width:16px;height:16px;border-radius:50%;border:2px solid #6a8090;flex:none;transition:.15s}
.radio-opt.active .dot{border-color:var(--c);background:var(--c);box-shadow:0 0 8px var(--c)}
.radio-opt .info{flex:1}
.radio-opt .info strong{display:block;font-size:14px}
.radio-opt .info small{color:#8aa0b0;font-size:12px}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.summary-row:last-child{border:0}
.summary-row .val{color:var(--c);font-weight:600}
.boot-log{font-family:ui-monospace,monospace;font-size:11px;color:var(--lime);line-height:1.6;margin-top:12px;max-height:120px;overflow:auto;opacity:.7}
.nav-back{display:flex;align-items:center;gap:6px;color:#9aafc0;font-size:13px;cursor:pointer;border:none;background:none;padding:6px 0;transition:.15s}
.nav-back:hover{color:var(--c)}
@media(max-width:600px){.panel{padding:22px}h1{font-size:24px}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>
<main class="panel">
  <div class="logo"><span class="dot"></span> CYBEROS <span class="pink">V3.0 // LINUX EDITION</span></div>
  <h1>System Installation</h1>
  <p class="muted" id="subtitle">Configure your workspace before entering CyberOS — 12 setup steps.</p>
  <div class="step-label" id="stepLabel">Step 1 of 12</div>
  <div class="steps" id="steps"></div>
  <section id="page"></section>
</main>
<script>
const S='cyberos-v2-state';
const D={setup:true,setupVersion:5,business:false,name:'Operator',username:'operator',password:'',company:'CYBER NETWORK',accent:'#00f6ff',theme:'cyber',language:'en',timezone:'Europe/London',keyboard:'us',desktop:'gnome',privacy:'balanced',serverUrl:'',apps:[],websites:[]};
const T={
  cyber:{name:'Cyber Neon',cyan:'#00f6ff',pink:'#ff2bd6',lime:'#a6ff00',bg:'#02040a'},
  matrix:{name:'Matrix',cyan:'#00ff66',pink:'#00cc44',lime:'#b6ff00',bg:'#020b06'},
  violet:{name:'Violet Pulse',cyan:'#b36bff',pink:'#ff4fd8',lime:'#f0a6ff',bg:'#08020f'},
  sunset:{name:'Neon Sunset',cyan:'#ffb000',pink:'#ff3b7a',lime:'#ffe600',bg:'#0d0402'},
  ice:{name:'Ice Grid',cyan:'#75e6ff',pink:'#8fb8ff',lime:'#d9ffff',bg:'#020912'},
  blood:{name:'Blood Moon',cyan:'#ff3030',pink:'#ff6090',lime:'#ffaa00',bg:'#0a0202'},
  ocean:{name:'Deep Ocean',cyan:'#00b4ff',pink:'#0088ff',lime:'#00ffaa',bg:'#020a14'},
  amber:{name:'Amber Glow',cyan:'#ffaa44',pink:'#ff6644',lime:'#ffdd44',bg:'#100a02'},
};
const LANGS={en:'English',fr:'Français',de:'Deutsch',es:'Español',pt:'Português',it:'Italiano',nl:'Nederlands',pl:'Polski',ja:'日本語',zh:'中文'};
const TZS=['Europe/London','Europe/Paris','Europe/Berlin','Europe/Madrid','Europe/Rome','Europe/Amsterdam','America/New_York','America/Los_Angeles','America/Chicago','Asia/Tokyo','Asia/Shanghai','Asia/Kolkata','Australia/Sydney','UTC'];
const KEYS={us:'US (QWERTY)',uk:'UK (QWERTY)',de:'DE (QWERTZ)',fr:'FR (AZERTY)',es:'ES (QWERTY)',it:'IT (QWERTY)',dvorak:'Dvorak',colemak:'Colemak'};
const DESKTOPS={
  gnome:{name:'GNOME',desc:'Clean, modern desktop with Activities overview'},
  kde:{name:'KDE Plasma',desc:'Highly customisable, Windows-like layout'},
  xfce:{name:'Xfce',desc:'Lightweight and fast for older hardware'},
  cinnamon:{name:'Cinnamon',desc:'Traditional, familiar desktop'},
};
let state;
try{state={...structuredClone(D),...JSON.parse(localStorage.getItem(S)||'null')}}catch(e){state=structuredClone(D)}
state=Object.assign(structuredClone(D),state);
let step=0;
const TOTAL=12;
const esc=x=>String(x??'').replace(/[&<>"]/g,m=>({'&':'&','<':'<','>':'>','"':'"'}[m]));
function save(){localStorage.setItem(S,JSON.stringify(state))}
function renderSteps(){
  document.getElementById('stepLabel').textContent='Step '+(step+1)+' of '+TOTAL;
  document.getElementById('steps').innerHTML=Array.from({length:TOTAL}).map((_,i)=>'<i class="step'+(i<step?' done':i===step?' on':'')+'"></i>').join('');
}
function radioList(opts,prop,cols){
  const cls=cols?'grid':''; 
  return '<div class="'+cls+'" style="'+(cols?'display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px':'')+'">'
    +Object.entries(opts).map(([k,v])=>{
      const label=typeof v==='string'?v:v.name;
      const desc=typeof v==='string'?'':v.desc;
      return `<div class="radio-opt ${state[prop]===k?'active':''}" onclick="state.${prop}='${k}';render()">
        <span class="dot"></span><div class="info"><strong>${esc(label)}</strong>${desc?'<small>'+esc(desc)+'</small>':''}</div></div>`;
    }).join('')+'</div>';
}
function render(){
  renderSteps();
  const p=document.getElementById('page');
  if(step===0)p.innerHTML=`
    <div class="card"><h2>Language & Region</h2><p class="muted">Select your preferred language for the system interface.</p>
    <label>Display language</label>
    ${radioList(LANGS,'language')}
    <button class="primary big-btn" style="margin-top:14px" onclick="next()">CONTINUE →</button></div>`;
  if(step===1)p.innerHTML=`
    <div class="card"><h2>Time Zone</h2><p class="muted">Choose your time zone for accurate clock and calendar.</p>
    <label>Time zone</label><select id="timezone">${TZS.map(tz=>`<option ${state.timezone===tz?'selected':''}>${tz}</option>`).join('')}</select>
    <button class="primary big-btn" onclick="next()">CONTINUE →</button></div>`;
  if(step===2)p.innerHTML=`
    <div class="card"><h2>Keyboard Layout</h2><p class="muted">Select your keyboard layout. This affects typing in all apps.</p>
    ${radioList(KEYS,'keyboard')}
    <button class="primary big-btn" style="margin-top:14px" onclick="next()">CONTINUE →</button></div>`;
  if(step===3)p.innerHTML=`
    <div class="card"><h2>Create User Account</h2><p class="muted">Set up your operator credentials for this system.</p>
    <label>Full name</label><input id="name" value="${esc(state.name)}">
    <label>Username (lowercase, no spaces)</label><input id="username" value="${esc(state.username)}" style="text-transform:lowercase">
    <label>Password (min 8 characters)</label><input id="password" type="password" value="${esc(state.password)}" placeholder="••••••••">
    <button class="primary big-btn" onclick="next()">CONTINUE →</button></div>`;
  if(step===4)p.innerHTML=`
    <div class="card"><h2>Workspace Mode</h2><p class="muted">Choose how you'll use CyberOS. You can switch anytime in Settings.</p>
    <div class="grid">
      <button class="mode-card ${!state.business?'active':''}" onclick="state.business=false;render()"><span class="ico">👤</span><strong>PERSONAL</strong><small class="muted">Apps, games & utilities</small></button>
      <button class="mode-card ${state.business?'active':''}" onclick="state.business=true;render()"><span class="ico">🏢</span><strong>BUSINESS</strong><small class="muted">Contacts, tasks & analytics</small></button>
    </div>
    <button class="primary big-btn" style="margin-top:14px;width:100%" onclick="next()">CONTINUE →</button></div>`;
  if(step===5)p.innerHTML=`
    <div class="card"><h2>Company & Branding</h2><p class="muted">Customise your workspace identity.</p>
    <label>Company / workspace name</label><input id="company" value="${esc(state.company)}">
    <label>Accent color</label><input id="accent" type="color" value="${esc(state.accent)}">
    <button class="primary big-btn" style="width:100%" onclick="next()">CONTINUE →</button></div>`;
  if(step===6)p.innerHTML=`
    <div class="card"><h2>Desktop Environment</h2><p class="muted">Choose your preferred desktop shell. All are glassmorphism-enabled.</p>
    ${radioList(DESKTOPS,'desktop')}
    <button class="primary big-btn" style="margin-top:14px" onclick="next()">CONTINUE →</button></div>`;
  if(step===7)p.innerHTML=`
    <div class="card"><h2>Theme Selection</h2><p class="muted">Pick a complete neon theme for your desktop.</p>
    <div class="grid">${Object.entries(T).map(([k,t])=>`<button class="theme ${state.theme===k?'active':''}" onclick="state.theme='${k}';state.accent='${t.cyan}';render()"><b>${t.name}</b><br><small style="color:${t.cyan}">${t.cyan}</small><br><small style="color:${t.pink}">${t.pink}</small></button>`).join('')}</div>
    <button class="primary big-btn" style="margin-top:14px;width:100%" onclick="next()">CONTINUE →</button></div>`;
  if(step===8)p.innerHTML=`
    <div class="card"><h2>Privacy & Data</h2><p class="muted">Control how your data is handled on this system.</p>
    ${radioList({strict:{name:'Strict (Local Only)',desc:'All data stays in browser, no cloud sync'},balanced:{name:'Balanced',desc:'Local storage with optional server sync'},open:{name:'Open (Cloud Sync)',desc:'Sync everything to the connected server'}},'privacy')}
    <button class="primary big-btn" style="margin-top:14px" onclick="next()">CONTINUE →</button></div>`;
  if(step===9)p.innerHTML=`
    <div class="card"><h2>Server Connection</h2><p class="muted">Connect to your CyberOS Business Server on Render for cloud sync (contacts, tasks, notes). You can skip this and add it later in Settings.</p>
    <label>Business server URL</label>
    <div class="flex-row"><input id="serverUrl" value="${esc(state.serverUrl||'')}" placeholder="https://your-app.onrender.com"></div>
    <div class="boot-log" id="connLog"></div>
    <div class="btn-row">
      <button class="primary" onclick="testConn()">TEST CONNECTION</button>
      <button onclick="next()">SKIP</button>
    </div>
    <div class="btn-row" style="margin-top:8px">
      <button class="primary" style="flex:1" onclick="finish(true)">CONNECT & FINISH</button>
      <button style="flex:1" onclick="next()">SKIP →</button>
    </div></div>`;
  if(step===10)p.innerHTML=`
    <div class="card"><h2>Application Selection</h2><p class="muted">Choose which apps to install. You can add or remove apps later in Settings.</p>
    <div class="app-grid" id="appGrid"></div>
    <button class="primary big-btn" style="margin-top:14px;width:100%" onclick="next()">CONTINUE →</button></div>`;
  if(step===11)p.innerHTML=`
    <div class="card"><h2>Installation Review</h2><p class="muted">Confirm your configuration. Click finish to complete setup.</p>
    <div class="summary-row"><span>Language</span><span class="val">${esc(LANGS[state.language]||state.language)}</span></div>
    <div class="summary-row"><span>Time zone</span><span class="val">${esc(state.timezone)}</span></div>
    <div class="summary-row"><span>Keyboard</span><span class="val">${esc(KEYS[state.keyboard]||state.keyboard)}</span></div>
    <div class="summary-row"><span>User</span><span class="val">${esc(state.name)} (@${esc(state.username)})</span></div>
    <div class="summary-row"><span>Mode</span><span class="val">${state.business?'Business':'Personal'}</span></div>
    <div class="summary-row"><span>Company</span><span class="val">${esc(state.company)}</span></div>
    <div class="summary-row"><span>Desktop</span><span class="val">${esc((DESKTOPS[state.desktop]||{}).name||state.desktop)}</span></div>
    <div class="summary-row"><span>Theme</span><span class="val">${esc((T[state.theme]||{}).name||state.theme)}</span></div>
    <div class="summary-row"><span>Privacy</span><span class="val">${esc(state.privacy)}</span></div>
    <div class="summary-row"><span>Server</span><span class="val">${state.serverUrl?'Connected':'Not configured'}</span></div>
    <button class="primary big-btn" style="margin-top:16px" onclick="finish(false)">✓ COMPLETE INSTALLATION</button>
    <button class="nav-back" style="margin-top:8px" onclick="step--;render()">← Back</button>
    <div class="boot-log" id="installLog" style="max-height:160px;margin-top:14px"></div></div>`;
}
function renderAppGrid(){
  const grid=document.getElementById('appGrid'); if(!grid)return;
  if(!state.apps||!state.apps.length){grid.innerHTML='<p class="muted">Default apps will be installed.</p>';return;}
  grid.innerHTML=state.apps.map((a,i)=>`<div class="app-toggle on" data-ai="${i}" onclick="this.classList.toggle('on')"><span class="ico">${esc(a.icon||'APP')}</span><span>${esc(a.name)}</span><small>${esc(a.cat||'')}</small></div>`).join('');
}
function testConn(){
  const log=document.getElementById('connLog'); if(!log)return;
  const url=(document.getElementById('serverUrl')?.value||'').trim().replace(/\/$/,'');
  if(!url){log.innerHTML='Please enter a server URL first.';return;}
  log.innerHTML+='Connecting to '+url+' ...\\n';
  fetch(url+'/api/health').then(r=>r.json()).then(d=>{log.innerHTML+='✓ Connected: '+d.service+' v'+d.version+'\\n';}).catch(()=>{log.innerHTML+='⚠ Could not reach server. Check URL or try later.\\n';});
}
function next(){
  if(step===0){state.language=state.language;}
  if(step===1){state.timezone=document.getElementById('timezone')?.value||state.timezone;}
  if(step===3){state.name=document.getElementById('name')?.value||'Operator';state.username=(document.getElementById('username')?.value||'operator').toLowerCase().replace(/[^a-z0-9]/g,'');state.password=document.getElementById('password')?.value||'';}
  if(step===5){state.company=document.getElementById('company')?.value||state.company;state.accent=document.getElementById('accent')?.value;}
  step++;render();renderAppGrid();
}
function finish(connect){
  if(connect){state.serverUrl=(document.getElementById('serverUrl')?.value||'').trim().replace(/\/$/,'');}
  if(step===11){
    const log=document.getElementById('installLog');
    const lines=['[OK] Writing configuration...','[OK] Setting up desktop environment: '+(DESKTOPS[state.desktop]||{}).name,'[OK] Applying theme: '+(T[state.theme]||{}).name,'[OK] Installing '+ (state.apps?.length||28)+' applications...','[OK] Creating user account: '+state.username,'[OK] Configuring privacy: '+state.privacy,'[OK] Installation complete!'];
    let i=0;
    if(log){const iv=setInterval(()=>{if(i<lines.length){log.innerHTML+=lines[i++]+'\\n';log.scrollTop=log.scrollHeight;}else{clearInterval(iv);setTimeout(()=>{state.setup=false;state.setupVersion=5;save();location.href='index.html';},500);}},250);}else{doFinish();}
  } else { doFinish(); }
  function doFinish(){state.setup=false;state.setupVersion=5;save();location.href='index.html';}
}
render();renderAppGrid();
</script>
</body>
</html>
