<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CyberOS v2.1</title>
<meta name="theme-color" content="#050812">
<style>
:root{--cyan:#00f6ff;--pink:#ff2bd6;--lime:#a6ff00;--theme-bg:#02040a;--bg:#050812;--panel:rgba(28,30,38,.92);--line:rgba(255,255,255,.1);--text:#eaffff;--muted:#83a9b7;--accent:#0067c0;--taskbar-bg:rgba(20,22,30,.85);--win-hover:rgba(255,255,255,.08)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0a14;color:var(--text);font-family:'Segoe UI',Inter,system-ui,Arial,sans-serif}
body{background:linear-gradient(135deg,#0a1028 0%,#0d1a3a 35%,#1a0a2a 70%,#0a0a14 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;background-image:linear-gradient(rgba(0,246,255,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(0,246,255,.15) 1px,transparent 1px);background-size:48px 48px}
button,input,select,textarea{font:inherit}button{color:var(--text);border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;transition:.12s;border-radius:4px}
button:hover{background:var(--win-hover);border-color:rgba(255,255,255,.2)}button:active{transform:translateY(1px)}
#boot{position:fixed;inset:0;z-index:9999;background:#0a0a14;display:none;place-items:center}.bootbox{width:min(650px,90vw);font-family:ui-monospace,monospace;color:var(--cyan)}.bar{height:6px;border:1px solid var(--cyan);border-radius:4px;margin-top:16px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--cyan);border-radius:4px;animation:boot 1.5s forwards}@keyframes boot{to{width:100%}}
#desktop{position:fixed;inset:0 0 56px 0}.wall{position:absolute;inset:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.3;animation:float 12s ease-in-out infinite}.o1{width:340px;height:340px;background:var(--cyan);left:5%;top:10%}.o2{width:380px;height:380px;background:var(--pink);right:2%;bottom:5%;animation-delay:-5s}@keyframes float{50%{transform:translate(60px,-30px) scale(1.12)}}
#top{position:absolute;left:16px;right:16px;top:12px;height:50px;display:flex;align-items:center;justify-content:space-between;z-index:20}.brand{font-weight:600;letter-spacing:1px;color:rgba(255,255,255,.9);font-size:15px}.brand .pink{font-size:12px;opacity:.7}.status{display:flex;gap:8px;align-items:center}.chip{padding:6px 12px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:12px;border-radius:6px;color:rgba(255,255,255,.7)}
#icons{position:absolute;top:82px;left:18px;display:grid;grid-template-columns:repeat(auto-fill,96px);gap:8px;z-index:5;max-height:calc(100vh - 160px);overflow:auto;padding-right:8px}.appicon{height:90px;border-radius:8px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-size:11px;transition:.15s;background:transparent;border:none}.appicon .ico{font-size:28px;color:var(--cyan);font-weight:900;width:44px;height:44px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.08);margin-bottom:2px}.appicon:hover{background:rgba(255,255,255,.08);border-radius:8px}.appicon:hover .ico{background:rgba(0,103,192,.25)}
.window{position:absolute;display:none;flex-direction:column;width:min(820px,calc(100vw - 34px));height:min(580px,calc(100vh - 110px));min-width:280px;min-height:180px;background:var(--panel);border:1px solid rgba(255,255,255,.12);box-shadow:0 16px 48px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.3);backdrop-filter:blur(30px);border-radius:10px;overflow:hidden;z-index:30}.window.open{display:flex;animation:open .14s ease-out;contain:layout paint}.window .content{overflow:auto;overscroll-behavior:contain}.window iframe{display:block;max-width:100%;max-height:100%;overflow:hidden}@keyframes open{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}.window.active{z-index:100;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(0,103,192,.4)}.titlebar{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 0 0 14px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--line);cursor:default}.titlebar:active{cursor:grabbing}.title{font-weight:600;font-size:13px;flex:1;letter-spacing:.3px;color:rgba(255,255,255,.9)}.win-controls{display:flex;height:100%}.winbtn{width:46px;height:100%;border:none;border-radius:0;background:transparent;display:grid;place-items:center;font-size:11px;color:rgba(255,255,255,.7);transition:.1s}.winbtn:hover{background:rgba(255,255,255,.1)}.winbtn.close:hover{background:#e81123;color:#fff}.content{flex:1;min-height:0;overflow:auto;padding:16px}.content::-webkit-scrollbar{width:8px}.content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px}.content::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.35)}
.card{border:1px solid var(--line);background:rgba(255,255,255,.04);padding:14px;border-radius:8px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.cyberbtn{padding:10px 16px;border-radius:6px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;font-size:12px}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--text);outline:none;border-radius:6px}.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.muted{color:var(--muted);font-size:13px}.neon{color:var(--cyan)}.pink{color:var(--pink)}.lime{color:var(--lime)}.big{font-size:28px;font-weight:700}.stat{font-size:11px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}.list{display:grid;gap:6px}.listrow{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:6px}.listrow span:first-child{flex:1}
#taskbar{position:fixed;z-index:500;left:0;right:0;bottom:0;height:56px;background:var(--taskbar-bg);border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;padding:0 8px;backdrop-filter:blur(30px) saturate(180%)}.taskbar-left{flex:1;min-width:0}#start{height:42px;width:42px;border:none;background:transparent;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:.12s}#start:hover{background:rgba(255,255,255,.1)}.win-logo{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;width:18px;height:18px}.win-logo i{border-radius:1px}.win-logo i:nth-child(1){background:#0067c0}.win-logo i:nth-child(2){background:#00b4ff}.win-logo i:nth-child(3){background:#0099bc}.win-logo i:nth-child(4){background:#0078d4}
.taskbar-center{display:flex;align-items:center;gap:6px;justify-content:center}.tasks{display:flex;gap:4px;overflow:auto;align-items:center}.task{height:42px;min-width:44px;padding:0 12px;border-radius:6px;border:none;background:transparent;color:rgba(255,255,255,.85);font-size:12px;display:flex;align-items:center;gap:8px;transition:.1s;cursor:pointer}.task:hover{background:rgba(255,255,255,.1)}.task:active{background:rgba(0,103,192,.3)}
.taskbar-right{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding-right:4px}.clock{font-size:12px;color:rgba(255,255,255,.8);text-align:right;line-height:1.3;cursor:default;padding:4px 10px;border-radius:6px;transition:.1s}.clock:hover{background:rgba(255,255,255,.08)}
.tray-icon{width:32px;height:32px;border:none;background:transparent;border-radius:6px;color:rgba(255,255,255,.7);display:grid;place-items:center;cursor:pointer;font-size:14px;transition:.1s}.tray-icon:hover{background:rgba(255,255,255,.1)}
#startmenu{position:fixed;z-index:600;left:50%;transform:translateX(-50%);bottom:66px;width:min(640px,calc(100vw - 40px));max-height:72vh;overflow:auto;display:none;background:var(--panel);border:1px solid rgba(255,255,255,.1);box-shadow:0 16px 48px rgba(0,0,0,.5);padding:24px 28px;border-radius:12px;backdrop-filter:blur(40px) saturate(180%)}.search{padding:10px 16px;width:100%;margin-bottom:20px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);border-radius:24px;outline:none}.search:focus{border-color:var(--accent);background:rgba(255,255,255,.08)}.menuapps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.menuapps .appicon{height:80px;font-size:11px;border-radius:8px}.menuapps .appicon .ico{width:38px;height:38px;font-size:22px;border-radius:8px}.menuapps .appicon:hover{background:rgba(255,255,255,.1)}
#setupOverlay{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.6);display:none;place-items:center;padding:20px;backdrop-filter:blur(8px)}.setup{width:min(720px,96vw);max-height:92vh;overflow:auto;border:1px solid rgba(255,255,255,.1);background:var(--panel);padding:32px;box-shadow:0 16px 48px rgba(0,0,0,.5);border-radius:12px;backdrop-filter:blur(40px)}.steps{display:flex;gap:6px;margin-bottom:20px}.step{height:4px;flex:1;background:rgba(255,255,255,.1);border-radius:2px}.step.on{background:var(--accent)}
.themegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.themebtn{min-height:72px;padding:10px;text-align:left;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.04)}.themebtn:hover{background:rgba(255,255,255,.08)}.themebtn strong{display:block}.themebtn small{color:var(--muted)}.appdash{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.appdash .card{min-height:120px}.business{border-left:3px solid var(--pink);padding-left:12px}
.gamewrap{display:grid;place-items:center;min-height:100%}.game-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.badge{padding:4px 12px;border:1px solid var(--line);border-radius:20px;font-size:12px;background:rgba(255,255,255,.05)}
.board{display:grid;gap:4px}.cell{display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.03);font-weight:900;cursor:pointer;transition:.1s}.cell:hover{background:rgba(255,255,255,.08)}.snake-cell{display:inline-block;width:24px;height:24px;border-radius:3px}
body.mobile #icons{grid-template-columns:repeat(4,1fr);left:8px;right:8px}.mobile #icons .appicon{height:70px}.mobile .window{left:8px!important;top:62px!important;width:calc(100vw - 16px)!important;height:calc(100vh - 126px)!important;min-width:0}.mobile .titlebar{height:44px}.mobile #top{left:8px;right:8px}.mobile .chip.hide-mobile{display:none}
@media(max-width:650px){#icons{grid-template-columns:repeat(4,1fr);left:8px;right:8px;gap:6px}.appicon{height:70px}.appicon .ico{font-size:20px;width:38px;height:38px}.brand{font-size:13px}.status .chip:nth-child(2){display:none}.window{left:8px!important;top:68px!important;width:calc(100vw - 16px)!important;height:calc(100vh - 130px)!important}.titlebar{height:44px}.content{padding:12px}.menuapps{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="boot"><div class="bootbox"><div class="big">CYBEROS // V2.1</div><div class="muted">INITIALISING NEURAL DESKTOP...</div><div class="bar"><i></i></div><div id="bootlog" style="margin-top:12px;font-size:12px"></div></div></div>
<div id="desktop"><div class="wall"><div class="orb o1"></div><div class="orb o2"></div></div>
<div id="top"><div class="brand">CYBEROS <span class="pink">V2.1</span></div><div class="status"><div class="chip" id="modeChip">PERSONAL</div><div class="chip hide-mobile" id="netChip">SYSTEM ONLINE</div></div></div>
<div id="icons"></div></div>
<div id="taskbar"><div class="taskbar-left"></div><div class="taskbar-center"><button id="start"><div class="win-logo"><i></i><i></i><i></i><i></i></div></button><div class="tasks" id="tasks"></div></div><div class="taskbar-right"><span class="tray-icon" title="Network">📶</span><span class="tray-icon" title="Volume">🔊</span><div class="clock" id="clock"></div></div></div>
<div id="startmenu"><input class="search" id="appSearch" placeholder="Search for apps"><div style="font-size:12px;font-weight:600;color:rgba(255,255,255,.6);margin:4px 0 12px;text-transform:uppercase;letter-spacing:1px">Pinned</div><div class="menuapps" id="menuapps"></div></div>
<div id="setupOverlay"><div class="setup"><div class="steps" id="setupSteps"></div><div id="setupBody"></div></div></div>
<script src="js/apps.js"></script>
<script src="js/os.js"></script>
</body>
</html>
