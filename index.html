<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CyberOS v2.1</title>
<meta name="theme-color" content="#050812">
<style>
:root{--cyan:#00f6ff;--pink:#ff2bd6;--lime:#a6ff00;--theme-bg:#02040a;--bg:#050812;--panel:rgba(7,14,30,.88);--line:rgba(0,246,255,.28);--text:#eaffff;--muted:#83a9b7}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
body{background:radial-gradient(circle at 20% 10%,rgba(0,246,255,.13),transparent 30%),radial-gradient(circle at 80% 80%,rgba(255,43,214,.11),transparent 28%),#02040a}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(rgba(0,246,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(0,246,255,.08) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,#000,transparent)}
button,input,select,textarea{font:inherit}button{color:var(--text);border:1px solid var(--line);background:rgba(5,13,28,.86);cursor:pointer;transition:.15s;border-radius:4px}
button:hover{border-color:var(--cyan);box-shadow:0 0 18px rgba(0,246,255,.18)}button:active{transform:translateY(1px)}
#boot{position:fixed;inset:0;z-index:9999;background:#02040a;display:none;place-items:center}.bootbox{width:min(650px,90vw);font-family:ui-monospace,monospace;color:var(--cyan)}.bar{height:8px;border:1px solid var(--cyan);margin-top:16px}.bar i{display:block;height:100%;width:0;background:var(--cyan);box-shadow:0 0 15px var(--cyan);animation:boot 1.5s forwards}@keyframes boot{to{width:100%}}
#desktop{position:fixed;inset:0 0 54px 0}.wall{position:absolute;inset:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.45;animation:float 12s ease-in-out infinite}.o1{width:260px;height:260px;background:var(--cyan);left:5%;top:8%;box-shadow:0 0 100px var(--cyan)}.o2{width:300px;height:300px;background:var(--pink);right:2%;bottom:5%;box-shadow:0 0 110px var(--pink);animation-delay:-5s}@keyframes float{50%{transform:translate(60px,-30px) scale(1.12)}}
#top{position:absolute;left:16px;right:16px;top:12px;height:50px;display:flex;align-items:center;justify-content:space-between;z-index:20}.brand{font-weight:900;letter-spacing:3px;color:var(--cyan);text-shadow:0 0 14px rgba(0,246,255,.55)}.status{display:flex;gap:8px;align-items:center}.chip{padding:8px 11px;border:1px solid var(--line);background:rgba(2,8,18,.7);font-size:12px;border-radius:5px}
#icons{position:absolute;top:82px;left:18px;right:18px;display:grid;grid-template-columns:repeat(auto-fill,88px);gap:12px;z-index:5;max-height:calc(100vh - 160px);overflow:auto}.appicon{height:82px;border-radius:12px;padding:8px;display:grid;place-items:center;text-align:center;font-size:11px;transition:.2s}.appicon .ico{font-size:25px;color:var(--cyan);font-weight:900}.appicon:hover{transform:translateY(-3px);background:rgba(0,246,255,.08)}
.window{position:absolute;display:none;flex-direction:column;width:min(850px,calc(100vw - 34px));height:min(610px,calc(100vh - 110px));min-width:280px;min-height:180px;background:var(--panel);border:1px solid var(--cyan);box-shadow:0 0 22px var(--cyan),0 0 55px rgba(255,43,214,.18),inset 0 0 35px rgba(0,246,255,.05);backdrop-filter:blur(14px);border-radius:8px;overflow:hidden;z-index:30}.window.open{display:flex;animation:open .16s ease-out;contain:layout paint}.window .content{overflow:auto;overscroll-behavior:contain}.window iframe{display:block;max-width:100%;max-height:100%;overflow:hidden}@keyframes open{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}.window.active{z-index:100}.titlebar{height:42px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px;background:linear-gradient(90deg,rgba(0,246,255,.12),rgba(255,43,214,.08));border-bottom:1px solid var(--line);cursor:grab}.titlebar:active{cursor:grabbing}.title{font-weight:800;letter-spacing:1px;flex:1}.winbtn{width:31px;height:27px;border-radius:4px}.close{border-color:rgba(255,60,100,.55)}.close:hover{border-color:#ff4f78;background:rgba(255,60,100,.14)}.content{flex:1;min-height:0;overflow:auto;padding:16px}.content::-webkit-scrollbar{width:7px}.content::-webkit-scrollbar-thumb{background:rgba(0,246,255,.3)}
.card{border:1px solid var(--line);background:rgba(2,8,20,.62);padding:14px;border-radius:7px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.cyberbtn{padding:11px 14px;border-radius:5px;text-transform:uppercase;letter-spacing:1px;font-weight:700}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);background:#030812;color:var(--text);outline:none;border-radius:4px}.field input:focus,.field textarea:focus{border-color:var(--cyan);box-shadow:0 0 10px rgba(0,246,255,.12)}.muted{color:var(--muted);font-size:13px}.neon{color:var(--cyan);text-shadow:0 0 12px rgba(0,246,255,.5)}.pink{color:var(--pink)}.lime{color:var(--lime)}.big{font-size:28px;font-weight:900}.stat{font-size:12px;color:var(--muted);letter-spacing:1px}.list{display:grid;gap:8px}.listrow{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid rgba(0,246,255,.16);background:rgba(0,246,255,.025);border-radius:5px}.listrow span:first-child{flex:1}
#taskbar{position:fixed;z-index:500;left:0;right:0;bottom:0;height:54px;background:rgba(2,6,15,.94);border-top:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:7px 10px;backdrop-filter:blur(14px)}#start{height:40px;width:48px;font-weight:900;color:var(--cyan);font-size:18px}.tasks{display:flex;gap:6px;overflow:auto;flex:1}.task{height:38px;min-width:120px;padding:0 12px;border-radius:5px}.clock{font-family:ui-monospace,monospace;color:var(--cyan);padding:0 8px}
#startmenu{position:fixed;z-index:600;left:10px;bottom:62px;width:min(390px,calc(100vw - 20px));max-height:75vh;overflow:auto;display:none;background:rgba(3,8,20,.97);border:1px solid var(--cyan);box-shadow:0 0 35px rgba(0,246,255,.25);padding:14px;border-radius:8px}.search{padding:12px;width:100%;margin-bottom:12px;background:#020711;border:1px solid var(--line);color:var(--text);border-radius:5px}.menuapps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
#setupOverlay{position:fixed;inset:0;z-index:900;background:rgba(1,3,8,.97);display:none;place-items:center;padding:20px}.setup{width:min(720px,96vw);max-height:92vh;overflow:auto;border:1px solid var(--cyan);background:linear-gradient(145deg,rgba(5,15,32,.98),rgba(20,4,26,.98));padding:26px;box-shadow:0 0 60px rgba(0,246,255,.2);border-radius:10px}.steps{display:flex;gap:6px;margin-bottom:20px}.step{height:5px;flex:1;background:#14202a;border-radius:3px}.step.on{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.themegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.themebtn{min-height:72px;padding:10px;text-align:left;border:1px solid var(--line);border-radius:8px}.themebtn strong{display:block}.themebtn small{color:var(--muted)}.appdash{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.appdash .card{min-height:120px}.business{border-left:3px solid var(--pink);padding-left:12px}
.gamewrap{display:grid;place-items:center;min-height:100%}.game-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.badge{padding:4px 10px;border:1px solid var(--line);border-radius:20px;font-size:12px;background:rgba(0,246,255,.08)}
.board{display:grid;gap:4px}.cell{display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;background:#030812;font-weight:900;cursor:pointer;transition:.1s}.cell:hover{border-color:var(--cyan)}.snake-cell{display:inline-block;width:24px;height:24px;border-radius:3px}
body.mobile #icons{grid-template-columns:repeat(4,1fr);left:8px;right:8px}.mobile #icons .appicon{height:65px}.mobile .window{left:8px!important;top:62px!important;width:calc(100vw - 16px)!important;height:calc(100vh - 126px)!important;min-width:0}.mobile .titlebar{height:46px}.mobile #top{left:8px;right:8px}.mobile .chip.hide-mobile{display:none}
@media(max-width:650px){#icons{grid-template-columns:repeat(4,1fr);left:8px;right:8px;gap:6px}.appicon{height:65px}.appicon .ico{font-size:20px}.brand{font-size:13px}.status .chip:nth-child(2){display:none}.window{left:8px!important;top:68px!important;width:calc(100vw - 16px)!important;height:calc(100vh - 130px)!important}.titlebar{height:44px}.content{padding:11px}}
</style>
</head>
<body>
<div id="boot"><div class="bootbox"><div class="big">CYBEROS // V2.1</div><div class="muted">INITIALISING NEURAL DESKTOP...</div><div class="bar"><i></i></div><div id="bootlog" style="margin-top:12px;font-size:12px"></div></div></div>
<div id="desktop"><div class="wall"><div class="orb o1"></div><div class="orb o2"></div></div>
<div id="top"><div class="brand">CYBEROS <span class="pink">V2.1</span></div><div class="status"><div class="chip" id="modeChip">PERSONAL</div><div class="chip hide-mobile" id="netChip">SYSTEM ONLINE</div></div></div>
<div id="icons"></div></div>
<div id="taskbar"><button id="start">C</button><div class="tasks" id="tasks"></div><div class="clock" id="clock"></div></div>
<div id="startmenu"><input class="search" id="appSearch" placeholder="Search apps and websites..."><div class="menuapps" id="menuapps"></div></div>
<div id="setupOverlay"><div class="setup"><div class="steps" id="setupSteps"></div><div id="setupBody"></div></div></div>
<script src="js/apps.js"></script>
<script src="js/os.js"></script>
</body>
</html>
